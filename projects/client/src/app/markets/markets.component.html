<h1>Markets</h1><p class="muted">Supported instruments and current indicative bid/ask.</p><table><thead><tr><th>Symbol</th><th>Name</th><th>Type</th><th>Bid</th><th>Ask</th><th></th></tr></thead><tbody>@for(i of instruments();track i.instrumentId){<tr><td><strong>{{i.symbol}}</strong></td><td>{{i.name}}</td><td>{{i.instrumentType}}</td><td>{{quotes()[i.symbol]?.bid|number:'1.2-8'}}</td><td>{{quotes()[i.symbol]?.ask|number:'1.2-8'}}</td><td><button (click)="trade(i.symbol)">Trade</button></td></tr>}</tbody></table>
