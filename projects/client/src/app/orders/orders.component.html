<h1>Order history</h1><div class="split"><table><thead><tr><th>Side</th><th>Qty</th><th>Status</th><th>Submitted</th></tr></thead><tbody>@for(o of orders();track o.orderId){<tr (click)="select(o)" [class.selected]="selected()?.orderId===o.orderId"><td>{{o.side}}</td><td>{{o.quantity}}</td><td>{{o.status}}</td><td>{{o.submittedAt}}</td></tr>}</tbody></table>@if(selected();as o){<section class="panel"><h2>Lifecycle</h2><code>{{o.orderId}}</code><ol>@for(e of events();track e.eventId){<li><strong>{{e.eventType}}</strong><small>{{e.eventTime}}</small></li>}</ol></section>}</div>
