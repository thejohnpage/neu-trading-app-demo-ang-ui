<h1>Instrument analysis</h1><table><thead><tr><th>Symbol</th><th>Type</th><th>Trades</th><th>Quantity</th><th>Avg execution</th><th>Notional</th></tr></thead><tbody>@for(r of rows();track r.symbol){<tr><td><strong>{{r.symbol}}</strong></td><td>{{r.instrument_type}}</td><td>{{r.trade_count}}</td><td>{{r.total_quantity}}</td><td>{{r.average_execution_price}}</td><td>{{r.total_notional|number:'1.2-2'}}</td></tr>}</tbody></table>
