@if(open()){<div class="session-backdrop"><section class="session-modal" role="dialog" aria-modal="true" aria-labelledby="session-title"><h2 id="session-title">Session expiring</h2><p>Your session will expire in {{remaining()}}. Refresh your session to continue without signing in again, or log out now.</p><div class="session-actions"><button (click)="logout()">Log out now</button><button class="primary" (click)="refresh()" [disabled]="busy()">{{busy()?'Refreshing…':'Refresh session'}}</button></div>@if(error()){<p class="error">{{error()}}</p>}</section></div>}
